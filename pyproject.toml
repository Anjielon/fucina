[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fucina"
version = "0.2.0"
description = "Measured, per-tensor-family ternary quantization recipes for pre-trained language models"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Angelo Mogavero"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "rich>=13"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
tools = ["numpy>=1.24"]
test = ["pytest>=7", "textual>=0.80"]

[project.scripts]
fucina = "fucina.cli:main"

[project.urls]
Homepage = "https://github.com/Anjielon/fucina"

[tool.setuptools.packages.find]
include = ["fucina*"]

[tool.setuptools.package-data]
fucina = ["rules/*.yaml", "ternary/data/*.json", "ternary/data/*.npz", "replay/FORGE_COMMIT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
