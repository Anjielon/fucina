  - {from: "{forge}/thor/cattura_schur_esperti.py", to: hessians}                    # per-expert Gq statistics
  - {from: "{forge}/stato/tappa_a_delta_1018.py", to: post_tools}
  - {from: "{forge}/stato/bpost_scale_down_fp32_1026.py", to: post_tools}
  - {from: "{forge}/stato/bpost_verifica_1026.py", to: post_tools}
  - {from: "{forge}/stato/parziale_mmlu.py", to: post_tools}
  - {from: "{forge}/thor_v2/strumenti/mcnemar_mclp.py", to: post_tools}
