    cpu_hours: 14.6
    needs: [c0b, r2b3_dense_inputs, bf16, perm_map]
    code: ["bundle:objective_c/ptq2_costruttori.py", "bundle:raffina/comune.py"]
    note: "14.6 CPU h, split in shards of 4 threads (FUCINA_PTQ2_SHARDS); each tensor is solved independently"
    run:
      - "OC={models}/gguf/tony-tern/OBIETTIVO_C; V=$OC/varianti_ptq2; S=${FUCINA_PTQ2_SHARDS:-2}; NAMES=$(env HIP_VISIBLE_DEVICES= {python} -c \"import sys; sys.path.insert(0, '{models}/build/leve/raffina'); import comune as CM; src = CM.gp.GGUFPlaneSource(CM.R2B3M, layers=list(range(40))); r = CM.elenco_densi(src); print(' '.join(','.join(r[i::$S]) for i in range($S)))\")"
      - "OC={models}/gguf/tony-tern/OBIETTIVO_C; V=$OC/varianti_ptq2; i=0; pids=; for L in $NAMES; do i=$((i+1)); mkdir -p $V/scheggia$i; ( cd $OC/codice && env HIP_VISIBLE_DEVICES= TT_DEVICE=cpu OMP_NUM_THREADS=4 LEVE_THREADS=4 {python} ptq2_costruttori.py --out $V/scheggia$i --solo \"$L\" >> $V/shard$i.log 2>&1 ) & pids=\"$pids $!\"; done; for p in $pids; do wait $p; done"
      - "OC={models}/gguf/tony-tern/OBIETTIVO_C; {python} -m fucina.replay.merge_shards $OC/varianti_ptq2 p_bil1jarqdrq"
    produces:
      - {key: p2_dense, path: "{models}/gguf/tony-tern/OBIETTIVO_C/varianti_ptq2/p_bil1jarqdrq/tensori", verify: manifest, expect: recipe_c/recorded/p2_dense_tensors.manifest}
