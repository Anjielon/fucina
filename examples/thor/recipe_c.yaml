steps:
  # ── L0: layout ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: L0
    title: "install the code bundle with the replay roots; link the release engine and the bundle trees at the recorded places"
    kind: cpu
    status: ported
    cpu_hours: 0.05
    needs: [code_bundle]
    code: ["package:fucina.replay.bundle"]
    run:
      - "{python} -m fucina.replay.bundle install {bundle_src} --into {bundle} --root models={models} --root forge={forge} --root depot={depot} --root lavoro={lavoro} --root home={home} --root odino={odino} --root nas={nas} --root venv={venv}"
      - "OC={models}/gguf/tony-tern/OBIETTIVO_C; mkdir -p $OC {models}/build/leve {models}/build/thor-c0t/build-c0t {models}/build/llamacpp-tq1-k1024/build {models}/build/thor-rexppiani2 {depot}/tutto_ternario {depot}/e2e/codice/TT5-ottimizzato {forge}/thor_v2 {forge}/stato {models}/gguf/tony-tern/R026/v12/_lav {models}/gguf/tony-tern/R026/_bin {models}/gguf/tony-tern/SELRISP $OC/S1_FLUSSO_C_1013 $OC/S23_SEQUENZIALE_CORRETTO_1014 $OC/OBQ_FIBRATO_S4_1014 $OC/CARDAN_C0B $OC/ONPOLICY $OC/SINTESI_1025/BPP $OC/SINTESI_1025/L2 $OC/SINTESI_1025/L3/codice $OC/SINTESI_1025/F32/codice $OC/TRIO"
      - "ln -sfn {engine} {models}/build/thor-c0t/build-c0t/bin; ln -sfn {engine} {models}/build/llamacpp-tq1-k1024/build/bin"
      - "ln -sfn {bundle}/gguf_py_k1024 {models}/build/llamacpp-tq1-k1024/gguf-py; ln -sfn {bundle}/gguf_py_rexp {models}/build/thor-rexppiani2/gguf-py"
      - "ln -sfn {bundle}/raffina {models}/build/leve/raffina; ln -sfn {bundle}/tutto_ternario {depot}/tutto_ternario/codice; ln -sfn {bundle}/kernel_rotation {forge}/kernel-rotazione"
      - "OC={models}/gguf/tony-tern/OBIETTIVO_C; ln -sfn {bundle}/objective_c $OC/codice; ln -sfn {bundle}/s1 $OC/S1_FLUSSO_C_1013/codice; ln -sfn {bundle}/s2_fast2 $OC/S23_SEQUENZIALE_CORRETTO_1014/codice; ln -sfn {bundle}/s2_slow $OC/S23_SEQUENZIALE_CORRETTO_1014/codice_lento_corretto_1014; ln -sfn {bundle}/s2_fast1 $OC/S23_SEQUENZIALE_CORRETTO_1014/codice_veloce1_1014; ln -sfn {bundle}/obq $OC/OBQ_FIBRATO_S4_1014/codice; ln -sfn {bundle}/cardan $OC/CARDAN_C0B/codice; ln -sfn {bundle}/onpolicy $OC/ONPOLICY/codice; ln -sfn {bundle}/bpp $OC/SINTESI_1025/BPP/codice; ln -sfn {bundle}/l2 $OC/SINTESI_1025/L2/codice"
      - "OC={models}/gguf/tony-tern/OBIETTIVO_C; ln -sfn {bundle}/post_tools/scale_gateup_esporta.py $OC/SINTESI_1025/L3/codice/; ln -sfn {bundle}/post_tools/f32_esporta.py $OC/SINTESI_1025/F32/codice/; ln -sfn {bundle}/launchers/sonda.sh $OC/TRIO/sonda.sh; ln -sfn {bundle}/selrisp {models}/gguf/tony-tern/SELRISP/codice; ln -sfn {bundle}/kl/kl_realizzata.py {models}/gguf/tony-tern/R026/v12/_lav/kl_realizzata.py"
      - "for f in tappa_a_delta_1018.py bpost_scale_down_fp32_1026.py bpost_verifica_1026.py parziale_mmlu.py; do ln -sfn {bundle}/post_tools/$f {forge}/stato/$f; done; mkdir -p {forge}/thor_v2/strumenti; ln -sfn {bundle}/post_tools/mcnemar_mclp.py {forge}/thor_v2/strumenti/mcnemar_mclp.py; ln -sfn {bundle}/hessians {forge}/thor; ln -sfn {bundle}/selrisp/converti_multiple_choice.py {forge}/converti_multiple_choice.py"
    produces:
      - {key: bundle_installed, path: "{bundle}/INSTALLED.json", verify: exists}

  # ── fetch ────────────────────────────────────────────────────────────────────────────────────────────────────────
  - id: F0
    title: "download the public inputs at their pinned revisions and check their hashes"
    kind: fetch
    status: ported
    needs: [bundle_installed]
    code: ["package:fucina.replay.check_inputs"]
    note: "needs the huggingface_hub CLI (`hf`); ~120 GB"
    run:
      - "hf download ornith-ai/Ornith-1.5-35B-A3B --revision 10fbf86fed7ecee4a061f8b499a618f46001cac1 --local-dir {path.bf16}"
      - "hf download cais/mmlu --repo-type dataset --revision c30699e8356da336a370243923dbaf21066bb9fe all/test-00000-of-00001.parquet all/validation-00000-of-00001.parquet all/dev-00000-of-00001.parquet --local-dir {path.mmlu}"
      - "hf download Salesforce/wikitext --repo-type dataset --revision b08601e04326c79dfdd32d625aee71d232d685c3 --include 'wikitext-103-raw-v1/train-*' 'wikitext-103-raw-v1/validation-*' --local-dir {path.wikitext}"
      - "D={work}/download; mkdir -p $D; hf download Anjielon/Thor-T-35B-A3B-root --revision thor-t-v1 --local-dir $D/root; hf download Anjielon/Thor-T-bench --repo-type dataset --revision thor-t-v1 --include 'teacher/*' 'bench/*' 'corpora/*' 'stats/*' --local-dir $D/bench"
      - "hf download Anjielon/Thor-T-fold-stats --repo-type dataset --revision thor-t-v1 --include 'Gq_*.npy' --local-dir {path.gq_experts}"
      - "hf download Anjielon/Thor-T-bench --repo-type dataset --revision thor-t-v1 --include 'hessians/hessiane-densi-grande/*' 'logs/chain/mmlu_C_stored_order.log' --local-dir {work}/download/bench2; mkdir -p $(dirname {path.hess_dense}) $(dirname {path.c_mclp_record}); ln -sfn {work}/download/bench2/hessians/hessiane-densi-grande {path.hess_dense}; ln -sfn {work}/download/bench2/logs/chain/mmlu_C_stored_order.log {path.c_mclp_record}"
      - "D={work}/download; place() { mkdir -p \"$(dirname \"$2\")\"; ln -sfn \"$1\" \"$2\"; }; place $D/root/Thor-T-R2B3m-packed.gguf {path.root_packed}; place $D/bench/stats/Thor-v20-downaggr3.gguf {path.student_v20}; place $D/root/tensori_R2B3 $(dirname {path.r2b3_dense_inputs}); place $D/bench/teacher/Ornith-1.5-35B-A3B-Q8_0.gguf {path.teacher_q8}; place $D/bench/bench/mmlu_00000.bin {path.bench}; place $D/bench/bench/mmlu2000_mescolato.bin {path.bench_mixed}; place $D/bench/bench/mmlu2000_mescolato.indice.tsv $(dirname {path.bench_mixed})/mmlu2000_mescolato.indice.tsv; place $D/bench/corpora/calib_auto2_pulito.txt {path.corpus_attn}; place $D/bench/corpora/corpus_cot.txt {path.corpus_cot}; place $D/bench/corpora/e2e_corpus_4096_maestro.pt {path.teacher_corpus}; place $D/bench/corpora/e2e_heldout_4096_maestro.pt $(dirname {path.teacher_corpus})/e2e_heldout_4096_maestro.pt"
      - "{python} -m fucina.replay.check_inputs {recipe_dir}/recipe_c.yaml --set work={work} --set engine={engine} --set bundle_src={bundle_src} --set venv={venv} --out {work}/state/inputs_checked.json"
    produces:
      - {key: inputs_checked, path: "{work}/state/inputs_checked.json", verify: exists}

  # ── I: intermediates regenerated from public inputs ──────────────────────────────────────────────────────────────
  - id: I1
    title: "MMLU calibration selection (SELRISP): validation+dev, disjoint from test and bench, 1779 questions"
    kind: cpu
    status: ported
    determinism: bitwise
    cpu_hours: 0.01
    needs: [mmlu, bench, bf16]
    code: ["package:fucina.replay.inputs.mmlu_calibration"]
    run:
      - "{python} -m fucina.replay.inputs.mmlu_calibration --mmlu {path.mmlu} --bench {path.bench} --tokenizer {path.bf16} --out $(dirname {path.calib})"
    produces:
      - {key: calib_jsonl, path: "{models}/gguf/tony-tern/SELRISP/calib/calib_mmlu.jsonl", verify: sha256, expect: cc773ec667d59bfafb9d2e11ed5af13a49bd050172cec6412a83d20aa78e0dbd}
