# Replay of recipe C: from the released frozen root R2B3m to C, the trunk of Thor-T-35B-A3B-XS.
#
#   fucina replay examples/thor/recipe_c.yaml --set work=/data/thor-c --set engine=/opt/llama.cpp/build/bin \
#        --set bundle_src=/data/thor-c-code --set venv=/data/venv --dry-run
#
# Lineage (the record, Oct 2026; every number is MMLU-2000 on the launch engine):
#   R2B3m -> C0B -> P2 -> S1 -> S2 -> OBQ (69.25) -> joint CARDAN T550 (71.30) -> S7 on-policy g10 (71.70)
#         -> joint CARDAN T400 (72.40) -> POST 50 steps = C (73.15)
# C is the trunk of the released XS: 733 of 753 tensors byte-identical, the 20 others are block 40 (MTP head).
# Steps 14-24 of the recorded runner (the D2 branch: S6 -> N3 -> D2, 71.75) are not ancestors of C and are not here.
#
# Paths. The research code of the record (the "bundle", see fucina/replay/bundle.py and docs/REPLAY.md) reads and
# writes under the directory layout of the recording machine. The replay recreates that layout under {work}/layout:
# {models}, {forge}, {depot}, ... are the roots of that layout, and the bundle is installed with its recorded roots
# rewritten to them. No file outside the configured roots is read (checked by --dry-run --forbid ...).
name: thor-t-c
title: "Thor-T objective C: frozen root -> C (trunk of XS), single-plane TQ1_0R_1024"
description: >
  Ornith-1.5-35B-A3B (qwen35moe, GatedDeltaNet + MoE) ternarized with one ternary plane per tensor (TQ1_0R_1024),
  BitNet convention (token embedding and output head Q8_0, norms/router F32), 8,631,199,776 bytes.

forge:
  release: thor-recipe-c-v1        # annotated tag of the Fucina repository this recipe belongs to
  note: "the verdict step V records the forge commit: in a git clone the commit of this tag (HEAD must be it), in a release tarball the commit that git archive writes into fucina/replay/FORGE_COMMIT"

roots:
  work: {doc: "replay output; everything the replay writes goes here"}
  bundle_src: {default: "{recipe_dir}/../../bundles/thor_recipe_c", doc: "the code bundle (shipped in this repository: bundles/thor_recipe_c)"}
  engine: {doc: "bin/ directory of a build of the release engine (Anjielon/llama.cpp tag thor-t-v1): llama-perplexity, llama-server, libllama.so, libggml-base.so"}
  venv: {doc: "Python environment: torch (ROCm or CUDA), triton, numpy, transformers, pandas, pyarrow, safetensors"}
  python: {default: "{venv}/bin/python3", doc: "interpreter of that environment"}
  bundle: {default: "{work}/code", doc: "installed bundle (written by step L0)"}
  layout: {default: "{work}/layout", doc: "root of the recorded directory layout"}
  models: {default: "{work}/layout/models"}
  forge: {default: "{work}/layout/forge"}
  depot: {default: "{work}/layout/depot"}
  lavoro: {default: "{work}/layout/lavoro"}
  home: {default: "{work}/layout/home"}
  odino: {default: "{work}/layout/odino"}
  nas: {default: "{work}/layout/nas"}
  inputs: {default: "{work}/inputs", doc: "public downloads that have no fixed place in the layout"}

target:
  artifact: c_post50
  verify: tensors
  expect: bc36d18b7fd8257403653132fa0fa3db353b51c000304646322ef38c731b036b
  recorded_file_sha256: adb1ad8b199e82b3d8cdf105edbcfd7e0a52407af63d01943001bdd2a90af7cf
  mmlu2000: 73.15
  accept: >
    Tensor digest equal to the record = exact replay. Otherwise (expected: GPU training steps are not bit-reproducible
    on gfx1151, S7 samples rollouts) MMLU-2000 within 1.0 point of 73.15 and exact McNemar p >= 0.05 against the
    recorded per-question log, as in the internal re-run of 31 Oct (72.75 vs 73.15, p 0.43).

deviations:
  - "Recorded absolute paths are rewritten to the replay layout: the metadata note of the C0B and P2 writers (input paths) differs, so GGUF files are compared by tensor digest, not by file hash."
  - "Engine binaries come from the release engine (thor-t-v1), not from the development build 94ec619b: the CPU reference quantize/dequantize of TQ1_0R_1024 used by the Python code through ctypes was checked bit-identical (9 Nov); Vulkan results of the teacher dumps and of the S7 server are not bit-identical across builds."
  - "Step 17 (CARDAN base A.1) runs on OBQ instead of S6: it reads only the expert gate/up codes and H_ffn, which S6 does not change."
  - "Joint CARDAN steps 25 and 29: fused step from step 1 and patience 1000 (record: unfused for steps 1-50, stop/resume); fixed scales and plan reuse in 29 from step 1 (proven bit-identical on 4 steps)."

